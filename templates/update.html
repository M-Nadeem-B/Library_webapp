{% extends 'base.html' %}

{% block body %}
    <div style="text-align: center;" class="content">
        <h1 style="text-align: center;">Update Task</h1>
        <form action="{{ url_for('update', id=task.id) }}" method="POST">
            <input type="text" name="task" value="{{ task.task }}" required>
            <input type="submit" value="Update Task">
        </form>
    </div>
{% endblock %}
